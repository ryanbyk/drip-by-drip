name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check spacing tokens
        run: npm run audit:spacing

      # Public client config. Repository Variables override the defaults.
      # VITE_APP_URL empty → https://app.drip-by-drip.com (src/lib/appUrl.ts).
      # The artifact is the site root. Pages serves it on the custom domain;
      # a CNAME file is not used (Actions publishing ignores it).
      # Use the legacy anon JWT, not sb_publishable_.
      # Leave VITE_ESV_API_KEY unset — the Crossway key stays in Edge Function secrets.
      - name: Build
        env:
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
